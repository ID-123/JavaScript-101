<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Filtro de tarjetas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Barra de búsqueda -->
    <header>
        <input type="text" id="searchInput" placeholder="Buscar...">
    </header>

    <!-- Contenedor de tarjetas -->
    <main class="cards-container">

        <div class="card" data-name="javascript">
            <h2>JavaScript</h2>
            <p>Lenguaje web dinámico</p>
        </div>

        <div class="card" data-name="html">
            <h2>HTML</h2>
            <p>Estructura de páginas</p>
        </div>

        <div class="card" data-name="css">
            <h2>CSS</h2>
            <p>Estilos visuales</p>
        </div>

        <div class="card" data-name="python">
            <h2>Python</h2>
            <p>Lenguaje versátil</p>
        </div>

        <div class="card" data-name="java">
            <h2>Java</h2>
            <p>Orientado a objetos</p>
        </div>

        <div class="card" data-name="csharp">
            <h2>C#</h2>
            <p>Desarrollo en .NET</p>
        </div>

        <div class="card" data-name="cpp">
            <h2>C++</h2>
            <p>Alto rendimiento</p>
        </div>

        <div class="card" data-name="typescript">
            <h2>TypeScript</h2>
            <p>JS tipado</p>
        </div>

        <div class="card" data-name="go">
            <h2>Go</h2>
            <p>Concurrencia eficiente</p>
        </div>

        <div class="card" data-name="rust">
            <h2>Rust</h2>
            <p>Seguridad de memoria</p>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
